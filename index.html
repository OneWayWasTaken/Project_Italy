<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echi d'Italia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Echi d'Italia</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="figure.css">
</head>
<body>
<div id="app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gOmbra" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
    <linearGradient id="gVert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
    <radialGradient id="gTesta" cx=".36" cy=".28" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".36"/></radialGradient>
  </defs></svg>
  <canvas id="fx"></canvas>

  <!-- MENU -->
  <section id="scr-menu" class="screen active">
    <div class="titolo">
      <h1>ECHI D'ITALIA</h1>
      <p class="sub">Il Custode ascolta ciò che la storia ha taciuto</p>
    </div>
    <div class="menu-btns">
      <button class="btn grande" data-azione="nuova-prova">Battaglia di prova</button>
      <button class="btn" data-azione="tutorial">Tutorial guidato</button>
      <button class="btn" data-azione="manuale">Come si gioca</button>
      <button class="btn" data-azione="opzioni">Opzioni</button>
      <button class="btn" disabled title="Fase 3">Storia (presto)</button>
      <button class="btn" disabled title="Fase 4">Evocazioni (presto)</button>
      <button class="btn" disabled title="Fase 5">Dungeon (presto)</button>
    </div>
    <p class="nota-fase">Fase 1 · sistema di scontri a monete</p>
  </section>

  <!-- SELEZIONE SQUADRA -->
  <section id="scr-squadra" class="screen">
    <header class="barra"><button class="btn piccolo" data-azione="menu">← Menu</button><h2>Scegli 4 Voci</h2><span id="sq-conta">0/4</span></header>
    <div class="squadra-layout">
      <div id="sq-griglia" class="sq-griglia"></div>
      <aside id="sq-dettaglio" class="sq-dettaglio"></aside>
    </div>
    <footer class="barra">
      <label>Incontro <select id="sq-incontro"></select></label>
      <button id="sq-affinita" class="btn piccolo">Tabella affinità</button>
      <button id="sq-via" class="btn grande" disabled>Combatti</button>
    </footer>
  </section>

  <!-- BATTAGLIA -->
  <section id="scr-battaglia" class="screen">
    <div id="campo">
      <div id="col-alleati" class="colonna"></div>
      <div id="stage">
        <div id="cam">
          <div id="stage-bg"></div>
          <div id="stage-floor"><div class="arena-disco"></div></div>
        </div>
        <div id="luce"></div><div id="vignetta"></div>
        <div id="turno-info"><span id="turno-n">Turno 1</span> <span id="ardore">Ardore 3</span></div>
        <div id="clash"></div>
      </div>
      <div id="col-nemici" class="colonna"></div>
    </div>
    <div id="pannello">
      <div id="skills"></div>
      <div id="comandi">
        <div class="vel">
          <button class="btn piccolo" data-vel="1">×1</button><button class="btn piccolo" data-vel="2">×2</button><button class="btn piccolo" data-vel="4">×4</button><button class="btn piccolo" data-vel="0" title="Salta animazioni">Salta</button>
        </div>
        <button id="btn-affondo" class="btn" style="display:none" title="Azione di squadra gratuita su un nemico in Cedimento (tasto A)">Affondo</button>
        <button id="btn-esegui" class="btn grande" disabled>Esegui turno</button>
        <button id="btn-audio" class="btn piccolo">Suono: sì</button>
      </div>
      <div id="log"></div>
    </div>
    <div id="risultato" class="overlay"></div>
  </section>

  <div id="modale" class="overlay"></div>
  <div id="ruota"><div class="tel">📱</div><p>Ruota il telefono in orizzontale per giocare</p></div>
</div>

<script src="data.js"></script>
<script src="combat.js"></script>
<script src="art.js"></script>
<script src="story.js"></script>
<script src="gacha.js"></script>
<script src="tutorial.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
