<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<script>
/* Telefoni: il gioco ha bisogno di almeno 820×380 px di spazio. Se lo schermo (tolte tacca e barre) è più
 * piccolo, si allarga il viewport e il browser rimpicciolisce tutto in proporzione: niente più parti tagliate. */
(function () {
  var MW = 820, MH = 380, meta = document.querySelector('meta[name=viewport]'), sonda = null, ultimo = '';
  function adatta() {
    if (!window.matchMedia || !matchMedia('(pointer: coarse)').matches) return;   // solo touch
    var land = innerWidth > innerHeight, lungo = Math.max(screen.width, screen.height), corto = Math.min(screen.width, screen.height);
    var devW = land ? lungo : corto, k = innerWidth / devW, il = 0, ir = 0, it = 0, ib = 0;
    if (sonda) { var cs = getComputedStyle(sonda); il = parseFloat(cs.paddingLeft) || 0; ir = parseFloat(cs.paddingRight) || 0; it = parseFloat(cs.paddingTop) || 0; ib = parseFloat(cs.paddingBottom) || 0; }
    var aw = devW - (il + ir) / k, ah = innerHeight / k - (it + ib) / k;
    var s = land ? Math.min(1, aw / MW, ah / MH) : 1;
    var c = (s > 0.995 ? 'width=device-width, initial-scale=1' : 'width=' + Math.round(devW / s)) + ', viewport-fit=cover, user-scalable=no';
    if (c !== ultimo) { ultimo = c; meta.setAttribute('content', c); }
  }
  var t = 0; function presto() { clearTimeout(t); t = setTimeout(adatta, 120); }
  document.addEventListener('DOMContentLoaded', function () {
    sonda = document.createElement('div');
    sonda.style.cssText = 'position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)';
    document.body.appendChild(sonda); adatta();
  });
  adatta(); addEventListener('resize', presto); addEventListener('orientationchange', function () { ultimo = ''; meta.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no'); setTimeout(adatta, 250); });
})();
</script>
<meta name="theme-color" content="#0e0c12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Echi d'Italia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Echi d'Italia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Alegreya+Sans:wght@400;500;700;800;900&family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="figure.css">
<link rel="stylesheet" href="battaglia.css">
<link rel="stylesheet" href="gacha.css">
<link rel="stylesheet" href="tema.css">
<link rel="stylesheet" href="battaglia-tema.css">
  <link rel="stylesheet" href="rifinitura.css">
  <link rel="stylesheet" href="minimal.css">
</head>
<body>
<div id="app">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="gOmbra" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></linearGradient>
    <linearGradient id="gVert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".2"/><stop offset=".35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".34"/></linearGradient>
    <radialGradient id="gTesta" cx=".36" cy=".28" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".36"/></radialGradient>
  </defs></svg>
  <div id="bacheca"></div>
  <canvas id="fx"></canvas>
  <div id="hud">
    <div class="hud-sx telaio">
      <div class="hud-id"><small id="hud-num">N° 000000</small><b><i>LV</i><span id="hud-lv">01</span></b></div>
      <div class="hud-cap" id="hud-cap"></div>
      <div class="hud-ris"><div class="r sig"><span class="ic">❂</span><span id="hud-sig">0</span></div><div class="r den"><span class="ic">◎</span><span id="hud-den">0</span></div><div class="r xpb"><i id="hud-xpb"></i><span id="hud-xp">0 / 100</span></div></div>
    </div>
    <nav class="hud-nav" id="hud-nav"></nav>
  </div>

  <!-- ATRIO (schermata iniziale): vetrina con la Voce guida, capitoli, banner e icone -->
  <section id="scr-menu" class="screen active">
    <div class="at-vetrina telaio rosso">
      <div class="at-testa"><span class="lv" id="at-lv"></span><span class="id" id="at-id"></span><span class="marchio">ECHI D'ITALIA</span></div>
      <div class="at-scena" id="menu-scena" title="Tocca la Voce"></div>
    </div>
    <div class="at-colonna telaio" id="at-capitoli"><div class="at-motto">ASCOLTA L'ECO · RESTITUISCI LA STORIA</div></div>
    <div class="at-dx">
      <div class="at-icone">
        <button class="at-ic" data-azione="manuale" title="Come si gioca">?</button>
        <button class="at-ic" data-azione="tutorial" title="Tutorial">✎</button>
        <button class="at-ic" data-azione="opzioni" title="Opzioni">⚙</button>
      </div>
      <div id="at-banner" class="at-dx" style="flex:1"></div>
    </div>
    <p class="nota-fase" id="nota-versione" style="display:none">Echi d'Italia · v3.0</p>
  </section>

  <!-- VOCI: composizione della squadra -->
  <section id="scr-squadra" class="screen">
    <aside class="vs-sx">
      <div class="vs-capo telaio"><span class="piastra">Voce guida</span><div class="vs-capo-fig" id="vs-capo"></div><small id="vs-capo-n"></small></div>
      <div class="vs-squadre telaio" id="vs-squadre"></div>
    </aside>
    <div class="vs-centro telaio">
      <div class="vs-testa"><div class="vs-nome"><b id="vs-titolo">Squadra</b><button id="vs-rinomina" title="Rinomina">✎</button><span id="sq-conta" class="piastra scura">0/4</span></div><div class="vs-filtri" id="sq-filtri"></div></div>
      <div class="vs-griglia" id="sq-griglia"></div>
    </div>
    <aside class="vs-dx">
      <div class="vs-aff telaio"><div class="titolo-aff">AFFINITÀ | SKILL</div><ul id="vs-aff"></ul><div class="conc" id="vs-conc"></div></div>
      <div class="vs-azioni">
        <button id="sq-dettagli" class="btn">Scheda della Voce</button>
        <button id="sq-consigliata" class="btn piccolo">Consigliata</button>
        <button id="sq-casuale" class="btn piccolo">Casuale</button>
        <label id="sq-inc-wrap"><select id="sq-incontro"></select></label>
        <button id="sq-affinita" class="btn piccolo">Tabella affinità</button>
        <button id="sq-via" class="btn grande" disabled>Combatti</button>
      </div>
    </aside>
  </section>

  <!-- BATTAGLIA: arena a tutto schermo, barra superiore, dock in basso (Voci + skill + comandi) -->
  <section id="scr-battaglia" class="screen">
    <div id="stage">
      <div id="cam">
        <div id="stage-bg"></div>
        <div id="stage-floor"><div class="arena-disco"></div></div>
        <svg id="frecce" aria-hidden="true"></svg>
      </div>
      <div id="luce"></div><div id="vignetta"></div>
      <div id="col-nemici" aria-hidden="true"></div>
      <div id="clash"></div>
    </div>
    <div id="cinema"><div class="cb su"></div><div class="cb giu"><div id="sequenza"></div></div></div>
    <header id="b-top">
      <div class="b-top-sx">
        <div class="plq"><span>TURNO</span><b id="turno-n">1</b></div>
        <div class="plq plq-ard"><span>ARDORE</span><div id="ardore"></div></div>
      </div>
      <div id="battuta" class="battuta"></div>
      <div class="b-top-dx">
        <div class="vel">
          <button class="btn piccolo" data-vel="1">×1</button><button class="btn piccolo" data-vel="2">×2</button><button class="btn piccolo" data-vel="4">×4</button><button class="btn piccolo" data-vel="0" title="Salta le animazioni di questo turno">⏭</button>
        </div>
        <button id="btn-log" class="btn piccolo icona" title="Registro del combattimento">☰</button>
        <button id="btn-audio" class="btn piccolo icona" title="Suono">♪</button>
        <button id="btn-menu" class="btn icona" title="Pausa (Esc)">❚❚</button>
      </div>
    </header>
    <div id="ris-col" title="Skill pianificate per affinità (3+ = Risonanza)"></div>
    <div id="b-dock">
      <div class="dk-braccio sx"></div>
      <div id="col-alleati"></div>
      <div id="skills"></div>
      <div id="comandi">
        <button id="btn-affondo" class="btn rosso" style="display:none" title="Azione di squadra gratuita su un nemico in Cedimento (tasto A)">Affondo!</button>
        <div class="dk-tog"><button id="btn-auto" class="btn piccolo" title="Pianifica automaticamente (puoi poi cambiare)">Auto</button><button id="tog-win" class="btn piccolo" title="Mostra la probabilità di vincere lo scontro su tutte le frecce">Vittoria %</button><button id="tog-dan" class="btn piccolo" title="Mostra i danni stimati sulle frecce">Danni</button></div>
        <button id="btn-esegui" disabled title="Esegui il turno (Invio)"><svg class="ingr" viewBox="-50 -50 100 100"><polygon points="45.8,-4.1 45.8,4.1 37.7,4.9 36.7,9.8 43.9,13.7 40.7,21.4 32.9,19.0 30.2,23.1 35.3,29.5 29.5,35.3 23.2,30.1 19.1,32.9 21.4,40.7 13.7,43.9 9.9,36.7 5.0,37.7 4.1,45.8 -4.1,45.8 -4.9,37.7 -9.8,36.7 -13.7,43.9 -21.4,40.7 -19.0,32.9 -23.1,30.2 -29.5,35.3 -35.3,29.5 -30.1,23.2 -32.9,19.1 -40.7,21.4 -43.9,13.7 -36.7,9.9 -37.7,5.0 -45.8,4.1 -45.8,-4.1 -37.7,-4.9 -36.7,-9.8 -43.9,-13.7 -40.7,-21.4 -32.9,-19.0 -30.2,-23.1 -35.3,-29.5 -29.5,-35.3 -23.2,-30.1 -19.1,-32.9 -21.4,-40.7 -13.7,-43.9 -9.9,-36.7 -5.0,-37.7 -4.1,-45.8 4.1,-45.8 4.9,-37.7 9.8,-36.7 13.7,-43.9 21.4,-40.7 19.0,-32.9 23.1,-30.2 29.5,-35.3 35.3,-29.5 30.1,-23.2 32.9,-19.1 40.7,-21.4 43.9,-13.7 36.7,-9.9 37.7,-5.0" class="dente"/><circle r="33" class="corona"/><circle r="24" class="cuore"/></svg><span>VIA</span></button>
      </div>
      <div class="dk-braccio dx"></div>
    </div>
    <div id="log" class="log-cassetto"></div>
    <div id="risultato" class="overlay"></div>
  </section>

  <!-- CAMPAGNA: capitoli -->
  <section id="scr-campagna" class="screen">
    <header class="barra"><button class="btn piccolo" data-azione="menu">← Menu</button><h2>Campagna</h2><span id="c-valute" class="valute"></span></header>
    <div id="c-griglia" class="c-griglia"></div>
    <div class="vg-modi" id="vg-modi"></div>
    <div class="vg-mappa telaio" id="vg-mappa"></div>
  </section>

  <!-- MAPPA A NODI (dungeon) -->
  <section id="scr-mappa" class="screen">
    <div id="m-sfondo"></div>
    <header class="barra"><button class="btn piccolo" id="m-esci">← Capitoli</button><h2 id="m-titolo"></h2><span id="m-valute" class="valute"></span></header>
    <div id="m-mappa" class="m-mappa"></div>
    <div class="m-fondo"><div id="m-squadra" class="m-squadra"></div><div id="m-oggetti" class="m-oggetti"></div></div>
  </section>

  <!-- STORIA: dialoghi visual novel -->
  <section id="scr-storia" class="screen">
    <div id="vn-sfondo"></div>
    <div id="vn-titolo"></div>
    <div id="vn-sx" class="vn-lato"></div><div id="vn-dx" class="vn-lato"></div>
    <div id="vn-barra"><button id="vn-log" class="btn piccolo">Registro</button><button id="vn-auto" class="btn piccolo">Auto</button><button id="vn-skip" class="btn piccolo">Salta ▶▶</button></div>
    <div id="vn-box" class="nascosta"><div id="vn-nome"></div><div id="vn-testo"></div><div id="vn-avanti">▼</div></div>
    <div id="vn-scelte" class="vn-scelte"></div>
  </section>

  <!-- EVOCAZIONI (gacha): banner con illustrazione, garanzia, evocazioni ×1/×10 con animazione -->
  <section id="scr-gacha" class="screen">
    <div id="g-sfondo"></div>
    <header class="barra trasparente"><button class="btn piccolo" data-azione="menu">← Menu</button><h2>Evocazioni</h2><span id="g-valute" class="valute"></span></header>
    <div class="g-layout">
      <nav id="g-banner" class="g-banner telaio"></nav>
      <div class="g-scena telaio"><div id="g-vetrina" class="g-vetrina"></div><div id="g-info" class="g-info"></div></div>
    </div>
    <footer class="g-piede">
      <div class="g-piede-sx"><button id="g-tassi" class="btn piccolo">Tassi</button><button id="g-storico" class="btn piccolo">Storico</button><button id="g-scambio" class="btn piccolo">Scambio</button></div>
      <button id="g-x1" class="btn g-evoca"><span>Evoca ×1</span><small>❂ 1</small></button>
      <button id="g-x10" class="btn grande g-evoca"><span>Evoca ×10</span><small>❂ 10 · ★4 garantita</small></button>
    </footer>
    <div id="g-risultato" class="overlay"></div>
  </section>

  <!-- ARCHIVIO: Voci e Codex -->
  <section id="scr-archivio" class="screen">
    <header class="barra"><button class="btn piccolo" data-azione="menu">← Menu</button><h2>Archivio</h2><span id="a-conta"></span></header>
    <div class="sq-filtri"><button class="chip-filtro a-tab on" data-tab="voci">Voci</button><button class="chip-filtro a-tab" data-tab="codex">Codex storico</button></div>
    <div id="a-corpo" class="a-corpo"></div>
  </section>

  <div id="modale" class="overlay"></div>
  <div id="ruota"><div class="tel">📱</div><p>Ruota il telefono in orizzontale per giocare</p></div>
</div>

<script src="data.js"></script>
<script src="combat.js"></script>
<script src="art.js"></script>
<script src="data_nemici.js"></script>
<script src="data_capitoli.js"></script>
<script src="data_scene.js"></script>
<script src="data_battute.js"></script>

<script src="musica.js"></script>
<script src="ui.js"></script>
<script src="story.js"></script>

<script src="main.js"></script>
</body>
</html>
